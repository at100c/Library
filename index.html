<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图书馆 · LIBRARY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4EEE1;
    --bg-deep:#EFE7D5;
    --panel:#FFFDF7;
    --ink:#3E382C;
    --muted:#8A7D66;
    --plank-top:#F1E8D2;
    --plank-face:#DFD0AC;
    --plank-edge:#CBB68F;
    --shadow:12px 14px 30px rgba(150,132,95,.28), -8px -8px 20px rgba(255,255,255,.75);
    --sel:#F6E189;
    --sel-ink:#4A3803;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg-deep) 100%);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100vh;
    padding:26px 22px 46px;
  }
  .wrap{max-width:1060px;margin:0 auto}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    margin-bottom:8px;
  }
  .views{
    display:flex;gap:4px;background:rgba(255,253,247,.65);
    border-radius:999px;padding:4px;
    box-shadow:inset 0 1px 3px rgba(150,132,95,.25);
  }
  .views button{
    border:none;background:transparent;cursor:pointer;font:inherit;
    font-size:13.5px;font-weight:600;color:var(--muted);
    padding:7px 16px;border-radius:999px;
  }
  .views button[aria-pressed="true"]{
    background:var(--panel);color:var(--ink);
    box-shadow:0 3px 8px rgba(150,132,95,.30);
  }
  .search{
    flex:1 1 220px;max-width:420px;
    display:flex;align-items:center;gap:8px;
    background:rgba(255,253,247,.65);
    border-radius:999px;padding:8px 16px;
    box-shadow:inset 0 1px 3px rgba(150,132,95,.25);
  }
  .search span{color:var(--muted);font-size:14px}
  .search input{
    border:none;background:transparent;outline:none;font:inherit;
    font-size:13.5px;color:var(--ink);width:100%;
  }
  .search input::placeholder{color:var(--muted)}
  .langbar{
    margin-left:auto;
    display:flex;gap:4px;background:var(--panel);
    border-radius:999px;box-shadow:var(--shadow);padding:5px;
  }
  .langbar button{
    border:none;background:transparent;cursor:pointer;font:inherit;
    font-size:13.5px;font-weight:600;color:var(--muted);
    padding:7px 14px;border-radius:999px;
  }
  .langbar button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}

  header{text-align:center;margin:30px 0 10px}
  header h1{
    font-family:"Cinzel","Noto Serif SC","Songti SC","STSong","SimSun",serif;
    font-size:clamp(38px,6.5vw,56px);
    font-weight:900;
    letter-spacing:.14em;
    color:#6E5626;
    text-shadow:
      0 1px 0 #FFFDF4,
      0 2px 0 #D9C491,
      0 3px 0 #BFA76A,
      0 5px 0 #A68D4F,
      0 8px 10px rgba(101,84,50,.45),
      0 16px 28px rgba(101,84,50,.30);
  }
  header h1 .bi-zh{font-size:.62em;letter-spacing:.3em;opacity:1}

  /* ---------- shelves ---------- */
  .shelf-block{margin-top:46px}
  .shelf-head{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:0 6px;margin-bottom:14px;
  }
  .shelf-name{font-size:15px;font-weight:600;color:#6B5F49}
  .shelf-name .bi-zh{font-weight:500}
  .books{
    display:flex;align-items:flex-end;gap:30px;flex-wrap:wrap;
    padding:0 36px;
  }
  a.book-standing{display:block;text-decoration:none}
  .scene{perspective:1000px;padding:6px 10px 0 16px}
  .cuboid{
    position:relative;width:138px;height:178px;
    transform-style:preserve-3d;
    transform:rotateY(-24deg) rotateX(2deg);
    transition:transform .35s ease;
  }
  a.book-standing:hover .cuboid,a.book-standing:focus-visible .cuboid{
    transform:rotateY(-15deg) rotateX(1deg) translateY(-5px);
  }
  .cuboid .face{position:absolute;backface-visibility:visible}
  .cuboid .front{
    inset:0;transform:translateZ(17px);
    border-radius:2px 5px 5px 2px;overflow:hidden;
    box-shadow:inset 3px 0 6px rgba(255,255,255,.35), inset -2px 0 4px rgba(0,0,0,.18);
  }
  .cuboid .front img{display:block;width:100%;height:100%;object-fit:cover}
  .cuboid .front::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.30) 5%, rgba(255,255,255,.28) 9%, rgba(0,0,0,.10) 14%, rgba(0,0,0,0) 22%);
  }
  .cuboid .back{inset:0;transform:translateZ(-17px);background:#4A4234;border-radius:2px 5px 5px 2px}
  .cuboid .spine{
    top:0;left:-17px;width:34px;height:100%;
    transform:rotateY(90deg);
    background:linear-gradient(180deg,#0E7373 0%,#0A5656 55%,#073F3F 100%);
    box-shadow:inset 0 0 12px rgba(0,0,0,.45);
  }
  .cuboid .pages{
    top:1.5%;right:-17px;width:34px;height:97%;
    transform:rotateY(90deg);
    background:repeating-linear-gradient(90deg,#FFFDF2 0 2px,#E9E1CB 2px 3px,#FBF7E9 3px 5px);
    box-shadow:inset 0 0 8px rgba(120,100,60,.35);
  }
  .book-shadow{
    width:150px;height:20px;margin:-20px 0 0 8px;
    background:radial-gradient(ellipse at center, rgba(74,60,30,.55) 0%, rgba(74,60,30,.28) 55%, rgba(74,60,30,0) 75%);
    filter:blur(3px);
  }
  .plank{
    position:relative;
    height:30px;margin-top:-2px;border-radius:3px;
    background:linear-gradient(180deg,#F7EFDA 0%,var(--plank-top) 18%,var(--plank-face) 55%,#BFA678 100%);
    box-shadow:
      inset 0 2px 2px rgba(255,255,255,.85),
      inset 0 -4px 6px rgba(120,98,55,.55),
      0 7px 10px -2px rgba(90,74,40,.55),
      0 16px 20px -8px rgba(101,84,50,.50),
      0 4px 6px rgba(120,100,60,.35);
  }
  .plank::after{
    content:"";position:absolute;left:1.5%;right:1.5%;top:100%;height:48px;
    background:linear-gradient(180deg, rgba(101,84,50,.52) 0%, rgba(101,84,50,.22) 55%, rgba(101,84,50,0) 100%);
    filter:blur(4px);
    pointer-events:none;
  }
  .noresult{
    display:none;text-align:center;color:var(--muted);
    font-size:14px;margin-top:56px;line-height:1.7;
  }

  /* ---------- all books grid ---------- */
  .grid{
    display:none;
    grid-template-columns:repeat(auto-fill,minmax(230px,280px));
    gap:36px;justify-content:center;margin-top:30px;
  }
  a.book-card{
    display:block;text-decoration:none;color:var(--ink);
    background:var(--panel);border-radius:20px;box-shadow:var(--shadow);
    padding:18px 18px 20px;
    transition:transform .25s ease;
  }
  a.book-card:hover{transform:translateY(-3px)}
  a.book-card img{display:block;width:100%;height:auto;border-radius:10px}
  .title{font-size:18px;font-weight:700;line-height:1.35;margin-top:16px}
  .subtitle{font-size:14px;margin-top:5px;line-height:1.55}
  .meta{font-size:13px;color:var(--muted);margin-top:5px}
  .enter{
    display:inline-block;margin-top:14px;background:var(--sel);color:var(--sel-ink);
    font-size:14px;font-weight:600;padding:9px 18px;border-radius:999px;
  }
  .bi{display:block}
  .bi-zh{font-size:.92em;opacity:.85}
  footer{margin-top:56px;color:var(--muted);font-size:12.5px;text-align:center;line-height:1.7}

  body[data-view="grid"] .shelves{display:none}
  body[data-view="grid"] .grid{display:grid}
  @media (max-width:560px){
    .cuboid{width:108px;height:140px}
    .book-shadow{width:118px}
    .books{gap:20px;padding:0 18px}
  }
</style>
</head>
<body data-view="shelves">
<div class="wrap">

  <div class="topbar">
    <div class="views" role="group" aria-label="View">
      <button type="button" data-view="shelves" aria-pressed="true" data-i18n="v_shelves">书架</button>
      <button type="button" data-view="grid" aria-pressed="false" data-i18n="v_all">全部图书</button>
    </div>
    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input type="search" id="q" data-i18n-ph="search_ph" placeholder="在我的图书馆里搜索">
    </label>
    <nav class="langbar" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="bi" aria-pressed="false">EN/中文</button>
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
    </nav>
  </div>

  <header>
    <h1 data-i18n="h1">图书馆</h1>
  </header>

  <div class="shelves" id="shelves"></div>
  <div class="grid" id="grid"></div>
  <p class="noresult" id="noresult" data-i18n="noresult">没有找到这本书。</p>
</div>

<script>
  var BOOKS = [
    {
      href:"child-care/",
      cover:"cover.jpg",
      title:"Child Care Design Guidelines",
      sub:{en:"Richmond child care design guidelines · interactive edition",
           zh:"Richmond 托儿所设计指引 · 交互版"},
      meta:"City of Richmond · December 2019",
      spine:"linear-gradient(180deg,#12A0A0 0%,#0C6B6B 55%,#084C4C 100%)",
      shelf:"finished"
    }
  ];
  var SHELVES = [
    {id:"reading",  name:{en:"Currently reading", zh:"正在读"}},
    {id:"next",     name:{en:"Next up",           zh:"接下来"}},
    {id:"finished", name:{en:"Finished",          zh:"已读完"}}
  ];
  var STR = {
    h1:{en:"LIBRARY", zh:"图书馆 · LIBRARY"},
    v_shelves:{en:"Shelves", zh:"书架"},
    v_all:{en:"All Books", zh:"全部图书"},
    search_ph:{en:"Search in My library", zh:"在我的图书馆里搜索"},
    open:{en:"Open this book →", zh:"打开这本书 →"},
    noresult:{en:"No book matches your search.", zh:"没有找到这本书。"}
  };
  var TITLES = {en:"LIBRARY", bi:"图书馆 · LIBRARY", zh:"图书馆 · LIBRARY"};
  var lang = "zh", query = "";

  function pick(s){
    if(lang === "en") return s.en;
    if(lang === "zh") return s.zh;
    return s.en + "\n" + s.zh;
  }
  function setBi(el, s){
    if(lang === "en"){ el.textContent = s.en; return; }
    if(lang === "zh"){ el.textContent = s.zh; return; }
    el.innerHTML = "";
    var a = document.createElement("span"); a.className = "bi"; a.textContent = s.en;
    var b = document.createElement("span"); b.className = "bi bi-zh"; b.textContent = s.zh;
    el.appendChild(a); el.appendChild(b);
  }
  function matches(book){
    if(!query) return true;
    var hay = (book.title + " " + book.sub.en + " " + book.sub.zh + " " + book.meta).toLowerCase();
    return hay.indexOf(query.toLowerCase()) >= 0;
  }

  function render(){
    var shelvesEl = document.getElementById("shelves");
    var gridEl = document.getElementById("grid");
    shelvesEl.innerHTML = ""; gridEl.innerHTML = "";
    var anyVisible = false;

    SHELVES.forEach(function(sh){
      var books = BOOKS.filter(function(b){ return b.shelf === sh.id && matches(b); });
      if(!books.length) return;
      anyVisible = true;
      var block = document.createElement("section"); block.className = "shelf-block";
      var head = document.createElement("div"); head.className = "shelf-head";
      var name = document.createElement("div"); name.className = "shelf-name"; setBi(name, sh.name);
      head.appendChild(name); block.appendChild(head);
      var row = document.createElement("div"); row.className = "books";
      books.forEach(function(b){
        var a = document.createElement("a");
        a.className = "book-standing"; a.href = b.href;
        a.setAttribute("aria-label", b.title);
        var scene = document.createElement("div"); scene.className = "scene";
        var cub = document.createElement("div"); cub.className = "cuboid";
        var back = document.createElement("div"); back.className = "face back";
        var spine = document.createElement("div"); spine.className = "face spine";
        if(b.spine) spine.style.background = b.spine;
        var pages = document.createElement("div"); pages.className = "face pages";
        var front = document.createElement("div"); front.className = "face front";
        var img = document.createElement("img"); img.src = b.cover; img.alt = b.title;
        front.appendChild(img);
        cub.appendChild(back); cub.appendChild(spine); cub.appendChild(pages); cub.appendChild(front);
        scene.appendChild(cub);
        var sh = document.createElement("div"); sh.className = "book-shadow";
        a.appendChild(scene); a.appendChild(sh);
        row.appendChild(a);
      });
      block.appendChild(row);
      var plank = document.createElement("div"); plank.className = "plank";
      block.appendChild(plank);
      shelvesEl.appendChild(block);
    });

    BOOKS.filter(matches).forEach(function(b){
      anyVisible = true;
      var a = document.createElement("a");
      a.className = "book-card"; a.href = b.href;
      var img = document.createElement("img"); img.src = b.cover; img.alt = b.title;
      var t = document.createElement("div"); t.className = "title"; t.textContent = b.title;
      var s = document.createElement("div"); s.className = "subtitle"; setBi(s, b.sub);
      var m = document.createElement("div"); m.className = "meta"; m.textContent = b.meta;
      var e = document.createElement("span"); e.className = "enter"; setBi(e, STR.open);
      a.appendChild(img); a.appendChild(t); a.appendChild(s); a.appendChild(m); a.appendChild(e);
      gridEl.appendChild(a);
    });

    document.getElementById("noresult").style.display = anyVisible ? "none" : "block";
  }

  function applyLang(l){
    lang = l;
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var key = el.getAttribute("data-i18n"); var s = STR[key]; if(!s) return;
      if(key === "h1" && lang === "bi"){
        el.innerHTML = "";
        var a = document.createElement("span"); a.className = "bi"; a.textContent = "LIBRARY";
        var b = document.createElement("span"); b.className = "bi bi-zh"; b.textContent = "图书馆";
        el.appendChild(a); el.appendChild(b);
      } else { setBi(el, s); }
    });
    var q = document.getElementById("q");
    q.placeholder = pick(STR.search_ph).split("\n")[0];
    document.title = TITLES[lang];
    document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
    document.querySelectorAll(".langbar button").forEach(function(btn){
      btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === lang ? "true" : "false");
    });
    try{ localStorage.setItem("library-lang", lang); }catch(e){}
    render();
  }

  document.querySelectorAll(".langbar button").forEach(function(btn){
    btn.addEventListener("click", function(){ applyLang(btn.getAttribute("data-lang")); });
  });
  document.querySelectorAll(".views button").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.body.setAttribute("data-view", btn.getAttribute("data-view"));
      document.querySelectorAll(".views button").forEach(function(b2){
        b2.setAttribute("aria-pressed", b2 === btn ? "true" : "false");
      });
    });
  });
  document.getElementById("q").addEventListener("input", function(ev){
    query = ev.target.value.trim(); render();
  });

  var saved = "zh";
  try{ saved = localStorage.getItem("library-lang") || "zh"; }catch(e){}
  if(["en","bi","zh"].indexOf(saved) < 0) saved = "zh";
  applyLang(saved);
</script>
</body>
</html>
