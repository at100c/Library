<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图书馆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:"QingNiaoFan";
    src:url("fonts/qingniao-fan.woff2") format("woff2");
    font-display:swap;
    unicode-range:U+3000-303F,U+3400-4DBF,U+4E00-9FFF,U+FF00-FFEF;
  }
  @font-face{
    font-family:"FFFTusj";
    src:url("fonts/fff-tusj.woff2") format("woff2");
    font-display:swap;
    unicode-range:U+0000-00FF;
  }
  :root{
    --bg:#F4EEE1;
    --bg-deep:#EFE7D5;
    --panel:#FFFDF7;
    --ink:#2B2721;
    --muted:#8A7D66;
    --shadow:12px 14px 30px rgba(150,132,95,.28), -8px -8px 20px rgba(255,255,255,.75);
    --sel:#F6E189;
    --sel-ink:#4A3803;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg-deep) 100%);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100vh;
    padding:26px 22px 60px;
  }
  .wrap{max-width:1060px;margin:0 auto}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .search{
    flex:1 1 220px;max-width:420px;
    display:flex;align-items:center;gap:8px;
    background:rgba(255,253,247,.65);
    border-radius:999px;padding:8px 16px;
    box-shadow:inset 0 1px 3px rgba(150,132,95,.25);
  }
  .search span{color:var(--muted);font-size:14px}
  .search input{
    border:none;background:transparent;outline:none;font:inherit;
    font-size:13.5px;color:var(--ink);width:100%;
  }
  .search input::placeholder{color:var(--muted)}
  .langbar{
    margin-left:auto;
    display:flex;gap:4px;background:var(--panel);
    border-radius:999px;box-shadow:var(--shadow);padding:5px;
  }
  .langbar button{
    border:none;background:transparent;cursor:pointer;font:inherit;
    font-size:13.5px;font-weight:600;color:var(--muted);
    padding:7px 14px;border-radius:999px;
  }
  .langbar button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}

  /* ---------- title ---------- */
  header{text-align:center;margin:34px 0 8px}
  header h1{
    font-family:"QingNiaoFan","FFFTusj","Long Cang","Ma Shan Zheng",sans-serif;
    font-size:clamp(44px,7.5vw,64px);
    font-weight:400;
    letter-spacing:.03em;
    color:#191919;
  }
  header h1.flat{font-size:clamp(66px,11.25vw,96px)}
  header h1 .bi-zh{font-size:1.2em;letter-spacing:.14em}
  .bi{display:block}
  .bi-zh{font-size:.92em;opacity:.85}

  /* ---------- books: front view + bottom-right shadow ---------- */
  .bookgrid{
    display:flex;flex-wrap:wrap;gap:52px 56px;
    justify-content:center;
    margin-top:52px;
  }
  a.bookitem{
    display:block;text-decoration:none;color:var(--ink);
    width:190px;text-align:center;
  }
  a.bookitem img{
    display:block;width:100%;height:auto;border-radius:2px 5px 5px 2px;
    box-shadow:
      8px 10px 16px rgba(56,44,20,.58),
      22px 30px 42px rgba(56,44,20,.45);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  a.bookitem:hover img,a.bookitem:focus-visible img{
    transform:translate(-3px,-5px);
    box-shadow:
      11px 14px 20px rgba(56,44,20,.60),
      29px 38px 50px rgba(56,44,20,.48);
  }
  .bname{
    margin-top:20px;font-size:16.5px;font-weight:700;line-height:1.4;
  }
  .bsub{
    margin-top:4px;font-size:13px;color:var(--muted);line-height:1.55;
  }
  .noresult{
    display:none;text-align:center;color:var(--muted);
    font-size:14px;margin-top:56px;line-height:1.7;
  }
  @media (max-width:560px){
    a.bookitem{width:150px}
    .bookgrid{gap:40px 28px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input type="search" id="q" placeholder="在我的图书馆里搜索">
    </label>
    <nav class="langbar" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="bi" aria-pressed="false">EN/中文</button>
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
    </nav>
  </div>

  <header>
    <h1 data-i18n="h1">图书馆</h1>
  </header>

  <div class="bookgrid" id="bookgrid"></div>
  <p class="noresult" id="noresult" data-i18n="noresult">没有找到这本书。</p>
</div>

<script>
  var BOOKS = [
    {
      href:"child-care/",
      cover:"cover.jpg",
      title:"Child Care Design Guidelines",
      sub:{en:"City of Richmond · December 2019",
           zh:"Richmond 托儿所设计指引 · 交互版"}
    },
    {
      href:"burnaby-child-care/",
      cover:"cover-burnaby.jpg",
      title:"Building the Future: Child Care Design Principles and Guidelines",
      sub:{en:"City of Burnaby · June 2024",
           zh:"Burnaby 托儿所设计原则与指引 · 交互版"}
    }
  ];
  var STR = {
    h1:{en:"LIBRARY", zh:"图书馆"},
    search_ph:{en:"Search in My library", zh:"在我的图书馆里搜索"},
    noresult:{en:"No book matches your search.", zh:"没有找到这本书。"}
  };
  var TITLES = {en:"LIBRARY", bi:"图书馆 · LIBRARY", zh:"图书馆"};
  var lang = "zh", query = "";

  function setBi(el, s){
    if(lang === "en"){ el.textContent = s.en; return; }
    if(lang === "zh"){ el.textContent = s.zh; return; }
    el.innerHTML = "";
    var a = document.createElement("span"); a.className = "bi"; a.textContent = s.en;
    var b = document.createElement("span"); b.className = "bi bi-zh"; b.textContent = s.zh;
    el.appendChild(a); el.appendChild(b);
  }
  function matches(book){
    if(!query) return true;
    var hay = (book.title + " " + book.sub.en + " " + book.sub.zh).toLowerCase();
    return hay.indexOf(query.toLowerCase()) >= 0;
  }

  function render(){
    var grid = document.getElementById("bookgrid");
    grid.innerHTML = "";
    var any = false;
    BOOKS.filter(matches).forEach(function(b){
      any = true;
      var a = document.createElement("a");
      a.className = "bookitem"; a.href = b.href;
      var img = document.createElement("img"); img.src = b.cover; img.alt = b.title;
      var n = document.createElement("div"); n.className = "bname"; n.textContent = b.title;
      var s = document.createElement("div"); s.className = "bsub"; setBi(s, b.sub);
      a.appendChild(img); a.appendChild(n); a.appendChild(s);
      grid.appendChild(a);
    });
    document.getElementById("noresult").style.display = any ? "none" : "block";
  }

  function applyLang(l){
    lang = l;
    var h1 = document.querySelector("[data-i18n='h1']");
    h1.classList.toggle("flat", lang === "zh");
    if(lang === "bi"){
      h1.innerHTML = "";
      var a = document.createElement("span"); a.className = "bi"; a.textContent = "LIBRARY";
      var b = document.createElement("span"); b.className = "bi bi-zh"; b.textContent = "图书馆";
      h1.appendChild(a); h1.appendChild(b);
    } else {
      setBi(h1, STR.h1);
    }
    var nr = document.getElementById("noresult"); setBi(nr, STR.noresult);
    document.getElementById("q").placeholder = (lang === "en" ? STR.search_ph.en : STR.search_ph.zh);
    document.title = TITLES[lang];
    document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
    document.querySelectorAll(".langbar button").forEach(function(btn){
      btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === lang ? "true" : "false");
    });
    try{ localStorage.setItem("library-lang", lang); }catch(e){}
    render();
  }

  document.querySelectorAll(".langbar button").forEach(function(btn){
    btn.addEventListener("click", function(){ applyLang(btn.getAttribute("data-lang")); });
  });
  document.getElementById("q").addEventListener("input", function(ev){
    query = ev.target.value.trim(); render();
  });

  var saved = "zh";
  try{ saved = localStorage.getItem("library-lang") || "zh"; }catch(e){}
  if(["en","bi","zh"].indexOf(saved) < 0) saved = "zh";
  applyLang(saved);
</script>
</body>
</html>
